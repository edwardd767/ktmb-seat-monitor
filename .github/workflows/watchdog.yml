name: KTMB Seat Monitor Watchdog (Paused)

on:
  workflow_dispatch:

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: KTMB watchdog is paused
        run: |
          echo "KTMB Seat Monitor Watchdog is currently paused."
          echo "It will not restart the KTMB monitoring service automatically."
          echo "The repository and watchdog code history have been kept for future use."
