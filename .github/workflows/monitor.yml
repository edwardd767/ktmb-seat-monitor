name: KTMB Trip Opening Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor-v2.mjs'
      - 'config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/monitor.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: ktmb-seat-monitor
  cancel-in-progress: false

jobs:
  check-trips:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check whether KTMB trips are open
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USER: edwardjacob721@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: tinishacon@gmail.com,tinashacon@gmail.com,evolanit@yahoo.com
          ALERT_EMAIL_BCC: edwardjacob721@gmail.com
          ALERT_EMAIL_FROM: edwardjacob721@gmail.com
        run: npm run monitor

      - name: Save notification state
        if: success()
        run: |
          if git diff --quiet -- .monitor-state.json; then
            echo "No notification-state change."
            exit 0
          fi
          git config user.name "KTMB Trip Opening Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add .monitor-state.json
          git commit -m "chore: update KTMB trip notification state [skip ci]"
          git pull --rebase
          git push

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktmb-monitor-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Queue next trip-opening check with retries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Kuala_Lumpur date +%F)
          LAST_TRAVEL_DATE=$(node -e "const c=require('./config.json'); console.log(c.routes.map(r=>r.travelDate).sort().at(-1))")
          ALL_NOTIFIED=$(node -e "const c=require('./config.json'); const s=require('./.monitor-state.json'); const n=new Set(s.notifiedRoutes||[]); console.log(c.routes.every(r=>n.has(r.id))?'yes':'no')")

          if [[ "$TODAY" > "$LAST_TRAVEL_DATE" ]]; then
            echo "All configured travel dates have passed. Monitoring chain will stop."
            exit 0
          fi

          if [[ "$ALL_NOTIFIED" == "yes" ]]; then
            echo "Both departure and return trips have opened and emails were sent. Monitoring chain will stop."
            exit 0
          fi

          DISPATCH_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches"
          SUCCESS=0

          for ATTEMPT in 1 2 3 4 5 6; do
            echo "Dispatch attempt $ATTEMPT of 6..."
            HTTP_CODE=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$DISPATCH_URL" \
              -d '{"ref":"main"}' || true)

            if [[ "$HTTP_CODE" == "204" ]]; then
              echo "Next trip-opening check queued successfully."
              SUCCESS=1
              break
            fi

            echo "Dispatch failed with HTTP $HTTP_CODE."
            cat /tmp/dispatch-response.txt || true

            if [[ "$ATTEMPT" -lt 6 ]]; then
              sleep $((ATTEMPT * 10))
            fi
          done

          if [[ "$SUCCESS" -ne 1 ]]; then
            echo "::error::Could not queue the next check after 6 attempts. The watchdog will recover it."
            exit 1
          fi

      - name: Keep current run alive for approximate 5-minute cadence
        if: always()
        run: |
          ALL_NOTIFIED=$(node -e "const c=require('./config.json'); const s=require('./.monitor-state.json'); const n=new Set(s.notifiedRoutes||[]); console.log(c.routes.every(r=>n.has(r.id))?'yes':'no')")
          if [[ "$ALL_NOTIFIED" == "yes" ]]; then
            echo "Both trips already notified; no wait required."
            exit 0
          fi
          sleep 240
