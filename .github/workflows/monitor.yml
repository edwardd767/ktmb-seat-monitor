name: KTMB Seat Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor-v2.mjs'
      - 'config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: ktmb-seat-monitor
  cancel-in-progress: false

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check KTMB seats
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USER: edwardjacob721@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: edwardjacob721@gmail.com
          ALERT_EMAIL_FROM: edwardjacob721@gmail.com
        run: npm run monitor

      - name: Save alert state
        if: success()
        run: |
          if git diff --quiet -- .monitor-state.json; then
            echo "No alert-state change."
            exit 0
          fi
          git config user.name "KTMB Seat Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add .monitor-state.json
          git commit -m "chore: update KTMB alert state [skip ci]"
          git pull --rebase
          git push

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktmb-monitor-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
